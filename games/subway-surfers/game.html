<!DOCTYPE html>
<html>
  <head>
    <script src="/js/main.js"></script>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title class="cloak">Subway Surfers</title>
    <span id="macvgmacvg" name="game234"></span>
    <link class="favicon" rel="shortcut icon" href="/logo.png" />
    <script src="/macvg/cloaker.js"></script>

    <script type="text/javascript" src="4399.z.js"></script>
    <script>
      window.config = {
        loader: "unity",
        debug: false,
        maxRatio: 16 / 9,
        minRatio: 9 / 16,

        title: "Subway Surfers: San Francisco",

        unityVersion: "2019.4.18f1",
        unityWebglBuildUrl: "Build/SanFrancisco.json",

        fileSize: 35,
        cachedDecompressedFileSizes: {
          "SanFrancisco.asm.code.unityweb": 9077143,
          "SanFrancisco.asm.framework.unityweb": 86369,
          "SanFrancisco.asm.memory.unityweb": 951447,
          "SanFrancisco.data.unityweb": 18323917,
          "SanFrancisco.wasm.code.unityweb": 7279617,
          "SanFrancisco.wasm.framework.unityweb": 90693
        }
      };
    </script>
  </head>

  <body>
    <script src="master-loader.js"></script>

    <!-- ⭐ SAVE/LOAD BRIDGE ⭐ -->
    <script>
      let unityInstanceRef = null;

      // Capture Unity instance created by unity.js
      Object.defineProperty(window, "unityInstance", {
        set(v) {
          unityInstanceRef = v;
          console.log("Unity instance captured:", v);

          // Auto-load save if exists
          const saved = localStorage.getItem("subway_surfers_save");
          if (saved) {
            v.SendMessage("GameController", "LoadFromJS", saved);
          }
        },
        get() {
          return unityInstanceRef;
        }
      });

      // Unity → JS (Unity calls this to save)
      window.SaveGameFromUnity = function(json) {
        localStorage.setItem("subway_surfers_save", json);
        console.log("Saved:", json);
      };

      // JS → Unity (wrapper page calls this)
      window.RequestUnitySave = function() {
        if (unityInstanceRef) {
          unityInstanceRef.SendMessage("GameController", "RequestSave");
        }
      };

      window.LoadGameIntoUnity = function() {
        if (unityInstanceRef) {
          const saved = localStorage.getItem("subway_surfers_save");
          if (saved) {
            unityInstanceRef.SendMessage("GameController", "LoadFromJS", saved);
          }
        }
      };
    </script>
  </body>
</html>
