<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subway Surfers | Viberverse</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="shortcut icon" href="/media/logo.png" type="image/x-icon" />
  </head>
  <body>
    <nav class="nav">
      <a href="/" class="logo">
        <img src="/media/logo.png" />
      </a>
      <a href="/games.html" class="nav-link">
        <img src="/media/games.svg" class="nav-link-icon" />
        <div class="nav-link-name">GAMES</div>
      </a>
      <a href="/proxies.html" class="nav-link">
        <img src="/media/proxies.svg" class="nav-link-icon" />
        <div class="nav-link-name">PROXIES</div>
      </a>
      <a href="/chat.html" class="nav-link">
        <img src="/media/chat.svg" class="nav-link-icon" />
        <div class="nav-link-name">CHAT</div>
      </a>
      <a href="/settings.html" class="nav-link">
        <img src="/media/settings.svg" class="nav-link-icon" />
        <div class="nav-link-name">SETTINGS</div>
      </a>
      <a href="/about.html" class="nav-link">
        <img src="/media/info.svg" class="nav-link-icon" />
        <div class="nav-link-name">ABOUT</div>
      </a>
    </nav>

    <div class="game-wrap">
      <div class="game-container">
        <iframe src="game.html" frameborder="0" id="gameframe"></iframe>

        <div class="game-bar">
          <img src="img/splash.jpg" class="game-bar-img"/>
          <h5 class="game-bar-title">Subway Surfers</h5>

          <div class="game-bar-right">
            <button id="saveBtn" style="margin-right:10px;">Save</button>
            <button id="loadBtn" style="margin-right:10px;">Load</button>
            <img src="/media/fullscreen.svg" id="fullscreen" title="Fullscreen Mode"/>
          </div>
        </div>
      </div>
    </div>

    <script>
      // EXPORT SAVE DATA (whatever the game stored in localStorage)
      function exportUnitySave() {
        const keys = Object.keys(localStorage);
        let saveData = {};

        keys.forEach(key => {
          if (key.includes("Unity") || key.includes("SanFrancisco") || key === "subway_surfers_save") {
            saveData[key] = localStorage.getItem(key);
          }
        });

        const blob = new Blob([JSON.stringify(saveData)], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "subway-surfers-save.json";
        a.click();

        URL.revokeObjectURL(url);
      }

      // IMPORT SAVE DATA
      function importUnitySave() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".json";

        input.onchange = e => {
          const file = e.target.files[0];
          const reader = new FileReader();

          reader.onload = event => {
            const data = JSON.parse(event.target.result);

            Object.keys(data).forEach(key => {
              localStorage.setItem(key, data[key]);
            });

            alert("Save imported! Reload or press Load.");
          };

          reader.readAsText(file);
        };

        input.click();
      }

      // BUTTON HOOKS → talk to iframe bridge
      document.getElementById("saveBtn").onclick = () => {
        const frame = document.getElementById("gameframe").contentWindow;
        if (frame && typeof frame.RequestUnitySave === "function") {
          frame.RequestUnitySave();
        } else {
          // fallback: just export localStorage
          exportUnitySave();
        }
      };

      document.getElementById("loadBtn").onclick = () => {
        const frame = document.getElementById("gameframe").contentWindow;
        if (frame && typeof frame.LoadGameIntoUnity === "function") {
          frame.LoadGameIntoUnity();
        } else {
          importUnitySave();
        }
      };
    </script>

    <script src="../script.js"></script>
  </body>
</html>
